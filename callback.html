<!DOCTYPE html>
<html>
<body>

Loading Spotify Login...


<button id="loginBtn">
Login Spotify
</button>

<script>

const code =
new URLSearchParams(
window.location.search
).get("code");

const verifier =
localStorage.getItem(
"code_verifier"
);

fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body:new URLSearchParams({

client_id:
"f3ecc07845394bfdaf48974c262d6541",

grant_type:
"authorization_code",

code,

redirect_uri:
"https://panjigraphica.github.io/cafe-musik-widget/callback/",

code_verifier:
verifier

})

})

.then(r=>r.json())

.then(data=>{

localStorage.setItem(
"spotify_token",
data.access_token
);

window.location =
"https://panjigraphica.github.io/cafe-musik-widget/";

});

</script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>

<script>
document
.getElementById("loginBtn")
.addEventListener(
"click",
loginSpotify
);
</script>

</body>
</html>
