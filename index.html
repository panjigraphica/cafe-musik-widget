<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cafe Musik Now Playing</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    width:800px;
    height:150px;
    background:transparent;
    overflow:hidden;
    font-family:'Orbitron',sans-serif;
}

.widget{
    width:800px;
    height:150px;
    border-radius:20px;
    background:linear-gradient(135deg,#12051f,#1d0b2d);
    border:2px solid #ff8c00;
    box-shadow:0 0 20px rgba(255,140,0,.8);
    display:flex;
    align-items:center;
}

.cover{
    width:110px;
    height:110px;
    margin:20px;
}

.cover img{
    width:100%;
    height:100%;
    border-radius:12px;
    border:2px solid #ff8c00;
    object-fit:cover;
}

.info{
    flex:1;
}

.now{
    color:#ff9d00;
    font-size:14px;
    letter-spacing:3px;
}

.title{
    color:white;
    font-size:28px;
    font-weight:700;
    margin-top:5px;
}

.artist{
    color:#ffc66d;
    font-size:16px;
    margin-top:5px;
}

.progress{
    margin-top:15px;
    width:90%;
    height:8px;
    background:#31123f;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    width:55%;
    height:100%;
    background:#ff8c00;
    box-shadow:0 0 15px #ff8c00;
}

.logo{
    width:180px;
    text-align:center;
    color:#ff8c00;
    font-size:24px;
    font-weight:700;
}

.logo small{
    display:block;
    color:white;
    font-size:11px;
    letter-spacing:2px;
}
</style>
</head>

<body>

<div class="widget">

    <div class="cover">
        <img id="albumArt"
        src="https://i.scdn.co/image/ab67616d0000b273c5716278abba6a103ad13e4f">
    </div>

    <div class="info">
        <div class="now">NOW PLAYING</div>

        <div class="title" id="songTitle">
            Cafe Musik
        </div>

        <div class="artist" id="artistName">
            Menunggu Spotify...
        </div>

        <div class="progress">
            <div class="bar" id="progressBar"></div>
        </div>
    </div>

    <div class="logo">
        CAFE MUSIK
        <small>RADIO MUSIC ONLINE</small>
    </div>

</div>

</body>
</html>
